<svg viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, Apple SD Gothic Neo, Pretendard, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6f9468" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c1584a" />
    </marker>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2c2f3a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="980" height="720" fill="#fbfaf3"/>

  <!-- Title -->
  <text x="490" y="50" text-anchor="middle" font-size="25" font-weight="700" fill="#2c2f3a">STUDYCAM 시스템 아키텍처</text>
  <text x="490" y="72" text-anchor="middle" font-size="12.5" fill="#8a92a6">스터디카페 무인 순찰 로봇 — 통신 방식별 데이터 흐름</text>

  <!-- ============================================================ -->
  <!-- Box A: TurtleBot3 (라즈베리파이 + 카메라 통합) -->
  <!-- ============================================================ -->
  <rect x="50" y="140" width="340" height="380" rx="14" fill="#eef4ee" stroke="#6f9468" stroke-width="2.2" filter="url(#softShadow)"/>
  <text x="80" y="176" font-size="22">🤖</text>
  <text x="112" y="177" font-size="16" font-weight="700" fill="#2c2f3a">TurtleBot3 + Nav2</text>
  <line x1="72" y1="192" x2="368" y2="192" stroke="#c9e0c5" stroke-width="1.2"/>

  <text x="72" y="222" font-size="13" fill="#4a5568">· RPLIDAR C1 + SLAM (Cartographer)</text>
  <text x="72" y="246" font-size="13" fill="#4a5568">· Nav2 웨이포인트 자율 순찰</text>

  <line x1="72" y1="270" x2="368" y2="270" stroke="#c9e0c5" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="72" y="296" font-size="12" fill="#7a8570" font-weight="600">탑재 카메라</text>
  <text x="72" y="320" font-size="13" fill="#4a5568">· Intel RealSense D435</text>
  <text x="72" y="344" font-size="13" fill="#4a5568">· 컬러 + 뎁스 MJPEG 스트리밍</text>
  <text x="72" y="372" font-size="11" fill="#8a92a6">포트 8000 (카메라 스트리밍)</text>

  <!-- ============================================================ -->
  <!-- Box B: PC / WSL Flask (Hub) -->
  <!-- ============================================================ -->
  <rect x="530" y="140" width="380" height="330" rx="16" fill="#fff7e6" stroke="#d99a2b" stroke-width="2.6" filter="url(#softShadow)"/>
  <text x="560" y="178" font-size="24">💻</text>
  <text x="595" y="179" font-size="17" font-weight="700" fill="#2c2f3a">PC (WSL2, Ubuntu 22.04)</text>
  <text x="720" y="202" text-anchor="middle" font-size="12.5" fill="#8a6a30">Flask 서버 · 통합 허브</text>
  <line x1="552" y1="215" x2="888" y2="215" stroke="#e8d19a" stroke-width="1.2"/>

  <text x="552" y="244" font-size="13" fill="#4a5568">· YOLO 추론 (sit / fallen / item / empty)</text>
  <text x="552" y="268" font-size="13" fill="#4a5568">· 뎁스 거리 계산 → 방(좌석) 번호 판정</text>
  <text x="552" y="292" font-size="13" fill="#4a5568">· rclpy 백그라운드 노드</text>
  <text x="552" y="314" font-size="13" fill="#4a5568">  (/map, /battery_state, tf 구독)</text>
  <text x="552" y="338" font-size="13" fill="#4a5568">· SQLite DB (출결·순찰·경고·분실물)</text>
  <text x="552" y="362" font-size="13" fill="#4a5568">· 지문 출결 TCP 서버 (양방향)</text>
  <text x="552" y="386" font-size="13" fill="#4a5568">· 순찰 시작/종료 API</text>
  <text x="552" y="410" font-size="13" fill="#4a5568">· 웹 대시보드 (실시간 폴링)</text>
  <text x="552" y="442" font-size="11" fill="#8a6a30">포트 5000(웹) · 5001(지문 TCP)</text>

  <!-- ============================================================ -->
  <!-- Box C: STM32 -->
  <!-- ============================================================ -->
  <rect x="530" y="550" width="380" height="150" rx="14" fill="#f7eeee" stroke="#c1584a" stroke-width="2.2" filter="url(#softShadow)"/>
  <text x="560" y="586" font-size="22">🔧</text>
  <text x="594" y="587" font-size="16" font-weight="700" fill="#2c2f3a">STM32 NUCLEO-F411RE</text>
  <line x1="552" y1="600" x2="888" y2="600" stroke="#e8cac6" stroke-width="1.2"/>
  <text x="552" y="624" font-size="13" fill="#4a5568">· AS608 지문 센서 (출결) · RC522 RFID (관리자 인증)</text>
  <text x="552" y="648" font-size="13" fill="#4a5568">· ESP-01 WiFi 모듈 · 서보모터 (출입문 개폐)</text>

  <!-- ============================================================ -->
  <!-- Arrows -->
  <!-- ============================================================ -->

  <!-- TurtleBot3(SLAM) -> PC -->
  <path d="M 392 225 C 440 225, 480 240, 528 258" fill="none" stroke="#6f9468" stroke-width="2.4" marker-end="url(#arrowGreen)"/>
  <text x="410" y="216" font-size="12.5" fill="#6f9468" font-weight="700">ROS2 (DDS)</text>
  <text x="410" y="248" font-size="10.5" fill="#6f9468">/map · tf · battery</text>

  <!-- TurtleBot3(카메라) -> PC -->
  <path d="M 392 340 C 440 340, 480 350, 528 362" fill="none" stroke="#4a6fa5" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <text x="410" y="331" font-size="12.5" fill="#4a6fa5" font-weight="700">HTTP (MJPEG)</text>
  <text x="410" y="384" font-size="10.5" fill="#4a6fa5">컬러 + 뎁스 스트림</text>

  <!-- STM32 -> PC (지문 출결 데이터 업로드) -->
  <path d="M 670 548 C 670 525, 670 495, 670 472" fill="none" stroke="#c1584a" stroke-width="2.4" marker-end="url(#arrowRed)"/>
  <text x="610" y="510" font-size="12.5" fill="#c1584a" font-weight="700">TCP 5001</text>
  <text x="602" y="525" font-size="10.5" fill="#c1584a">"FP,&lt;슬롯&gt;"</text>

  <!-- PC -> STM32 (조치 완료 시 출입문 개방 신호, 같은 TCP 연결의 반대 방향) -->
  <path d="M 750 472 C 750 495, 750 525, 750 548" fill="none" stroke="#c1584a" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="765" y="510" font-size="12.5" fill="#c1584a" font-weight="700">"DOOR_OPEN"</text>
  <text x="765" y="525" font-size="10.5" fill="#c1584a">(같은 연결, 역방향)</text>

</svg>
