<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="780" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">STUDYCAM 시스템 아키텍처</text>

  <!-- ================= TurtleBot / Raspberry Pi ================= -->
  <rect x="30" y="70" width="330" height="330" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="195" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">TurtleBot3 + 라즈베리파이</text>

  <rect x="55" y="115" width="280" height="55" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="195" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">turtlebot3_bringup</text>
  <text x="195" y="156" text-anchor="middle" font-size="11" fill="#4338ca">모터·라이다(LDS-02) 제어</text>

  <rect x="55" y="185" width="280" height="70" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="195" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">camera_stream.py</text>
  <text x="195" y="224" text-anchor="middle" font-size="11" fill="#4338ca">RealSense D435 (컬러+뎁스)</text>
  <text x="195" y="240" text-anchor="middle" font-size="11" fill="#4338ca">/video_feed, /depth_feed</text>

  <rect x="55" y="270" width="280" height="55" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="195" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">ROS2 토픽 발행</text>
  <text x="195" y="309" text-anchor="middle" font-size="11" fill="#4338ca">/battery_state, /map, /tf, /odom</text>

  <text x="195" y="352" text-anchor="middle" font-size="12" fill="#6366f1">하드웨어 I/O 담당</text>
  <text x="195" y="370" text-anchor="middle" font-size="11" fill="#818cf8">Ubuntu 22.04 (arm64)</text>

  <!-- ================= VirtualBox PC (Nav2) ================= -->
  <rect x="30" y="440" width="330" height="300" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="195" y="468" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">VirtualBox (Ubuntu)</text>

  <rect x="55" y="485" width="280" height="60" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="195" y="508" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">Nav2 + RViz</text>
  <text x="195" y="525" text-anchor="middle" font-size="11" fill="#047857">AMCL, costmap, 경로계획</text>

  <rect x="55" y="560" width="280" height="85" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="195" y="583" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">patrol_pkg / patrol_node</text>
  <text x="195" y="600" text-anchor="middle" font-size="11" fill="#047857">정식 ROS2 노드 (콜백 기반)</text>
  <text x="195" y="616" text-anchor="middle" font-size="11" fill="#047857">NavigateToPose 액션 클라이언트</text>
  <text x="195" y="632" text-anchor="middle" font-size="11" fill="#047857">웨이포인트 9개 왕복 + yaw 지정</text>

  <text x="195" y="675" text-anchor="middle" font-size="12" fill="#10b981">자율주행 담당</text>
  <text x="195" y="693" text-anchor="middle" font-size="11" fill="#34d399">colcon build / ros2 run</text>

  <!-- ================= WSL2 studycam_server ================= -->
  <rect x="440" y="70" width="360" height="500" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="620" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">WSL2 — studycam_server (Flask)</text>

  <rect x="465" y="115" width="310" height="80" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="620" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">LatestFrameReader / LatestDepthReader</text>
  <text x="620" y="155" text-anchor="middle" font-size="11" fill="#c2410c">MJPEG / 16bit PNG 멀티파트 파싱</text>
  <text x="620" y="171" text-anchor="middle" font-size="11" fill="#c2410c">항상 "최신 프레임"만 유지</text>

  <rect x="465" y="205" width="310" height="95" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="620" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">YOLOv8 추론 (best.pt)</text>
  <text x="620" y="245" text-anchor="middle" font-size="11" fill="#c2410c">sit / fallen / item / empty</text>
  <text x="620" y="261" text-anchor="middle" font-size="11" fill="#c2410c">픽셀+뎁스 → 맵좌표 → 좌석(방) 판정</text>
  <text x="620" y="277" text-anchor="middle" font-size="11" fill="#c2410c">연속감지 지속시간 기반 위급상황 판정</text>

  <rect x="465" y="315" width="310" height="70" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="620" y="338" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">RosBridge (rclpy 백그라운드 노드)</text>
  <text x="620" y="355" text-anchor="middle" font-size="11" fill="#c2410c">battery_state / map / tf 구독</text>
  <text x="620" y="371" text-anchor="middle" font-size="11" fill="#c2410c">로봇 위치·궤적 실시간 갱신</text>

  <rect x="465" y="400" width="310" height="70" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="620" y="423" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">SQLite (studycam.db)</text>
  <text x="620" y="440" text-anchor="middle" font-size="11" fill="#c2410c">students / attendance / patrol_log</text>
  <text x="620" y="456" text-anchor="middle" font-size="11" fill="#c2410c">warning_log (쓰러짐·분실물)</text>

  <rect x="465" y="485" width="310" height="65" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="620" y="508" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">지문 출결 TCP 서버 (:5001)</text>
  <text x="620" y="525" text-anchor="middle" font-size="11" fill="#c2410c">FP,&lt;슬롯&gt; 수신 / DOOR_OPEN 송신</text>

  <rect x="465" y="565" width="310" height="55" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="620" y="588" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Flask REST API (:5000)</text>
  <text x="620" y="605" text-anchor="middle" font-size="11" fill="#c2410c">/api/status, /api/patrol, /api/logs 등</text>

  <!-- ================= STM32 ================= -->
  <rect x="850" y="70" width="320" height="230" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="1010" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">STM32 NUCLEO-F411RE</text>

  <rect x="870" y="115" width="280" height="50" rx="8" fill="#ffffff" stroke="#f87171"/>
  <text x="1010" y="145" text-anchor="middle" font-size="12" fill="#7f1d1d">AS608 지문인식 센서</text>

  <rect x="870" y="175" width="280" height="50" rx="8" fill="#ffffff" stroke="#f87171"/>
  <text x="1010" y="205" text-anchor="middle" font-size="12" fill="#7f1d1d">MFRC522 RFID (관리자 인증)</text>

  <rect x="870" y="235" width="280" height="50" rx="8" fill="#ffffff" stroke="#f87171"/>
  <text x="1010" y="265" text-anchor="middle" font-size="12" fill="#7f1d1d">서보모터 (출입문 개폐) · ESP-01</text>

  <!-- ================= Web Dashboard ================= -->
  <rect x="850" y="440" width="320" height="150" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="1010" y="468" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">웹 대시보드</text>
  <rect x="870" y="485" width="280" height="80" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="1010" y="510" text-anchor="middle" font-size="12" fill="#1e40af">SLAM 맵 · 카메라 스트림</text>
  <text x="1010" y="528" text-anchor="middle" font-size="12" fill="#1e40af">좌석 현황 · 출결/순찰/경고 로그</text>
  <text x="1010" y="546" text-anchor="middle" font-size="12" fill="#1e40af">HTML / CSS / Vanilla JS</text>

  <!-- ================= Arrows ================= -->
  <!-- Pi camera -> studycam (HTTP MJPEG) -->
  <line x1="335" y1="220" x2="463" y2="180" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="180" font-size="11" fill="#c2410c" font-weight="600">HTTP MJPEG</text>

  <!-- Pi ROS topics -> studycam RosBridge (DDS) -->
  <line x1="335" y1="300" x2="463" y2="350" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="335" font-size="11" fill="#4338ca" font-weight="600">ROS2 DDS</text>

  <!-- Pi bringup <-> VirtualBox Nav2 (DDS, odom/scan/tf) -->
  <line x1="195" y1="400" x2="195" y2="438" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="205" y="422" font-size="11" fill="#4338ca" font-weight="600">ROS2 DDS (odom/scan/tf)</text>

  <!-- VirtualBox patrol_node -> studycam (HTTP POST patrol event) -->
  <path d="M 335 610 C 400 700, 400 700, 463 545" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="700" font-size="11" fill="#0369a1" font-weight="600">HTTP POST (/api/patrol)</text>

  <!-- studycam -> STM32 TCP (bidirectional) -->
  <line x1="775" y1="500" x2="848" y2="220" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="785" y="360" font-size="11" fill="#b91c1c" font-weight="600" transform="rotate(-70 785 360)">TCP :5001 (양방향)</text>

  <!-- studycam -> web dashboard (HTTP) -->
  <line x1="775" y1="560" x2="848" y2="515" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="545" font-size="11" fill="#1d4ed8" font-weight="600">HTTP :5000</text>

  <!-- legend -->
  <rect x="440" y="700" width="16" height="16" fill="#6366f1"/>
  <text x="462" y="713" font-size="11" fill="#334155">ROS2 DDS</text>
  <rect x="560" y="700" width="16" height="16" fill="#f97316"/>
  <text x="582" y="713" font-size="11" fill="#334155">HTTP (MJPEG/REST)</text>
  <rect x="720" y="700" width="16" height="16" fill="#ef4444"/>
  <text x="742" y="713" font-size="11" fill="#334155">TCP 소켓</text>
</svg>
